[package]
name = "xsm-net"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "portmapper"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
base64 = "0.22"
data-encoding = "2"
libc = "0.2"
tempfile = "3"
