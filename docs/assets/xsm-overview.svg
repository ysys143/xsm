<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
<defs>
 <linearGradient id="bg" x1="80" y1="40" x2="1350" y2="860" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF3F8"/></linearGradient>
 <linearGradient id="accent" x1="260" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#43B7A5"/><stop offset="1" stop-color="#5479E8"/></linearGradient>
 <filter id="shadow" x="60" y="250" width="1320" height="410" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#24364B" flood-opacity=".08"/></filter>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" stroke="#71839A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.eyebrow{font-size:13px;font-weight:700;letter-spacing:2.5px;fill:#728198}.title{font-size:39px;font-weight:700;letter-spacing:-1.5px;fill:#17263B}.subtitle{font-size:17px;fill:#66768B}.card-title{font-size:18px;font-weight:650;fill:#1C2B40}.body{font-size:14px;fill:#65758A}.small{font-size:12px;fill:#75849A}.label{font-size:12px;font-weight:650;fill:#405269}</style>
</defs>
<rect width="1440" height="900" rx="30" fill="url(#bg)"/><circle cx="1270" cy="115" r="190" fill="#DCEAF5" opacity=".38"/><circle cx="110" cy="800" r="210" fill="#DDF1EC" opacity=".45"/>
<text x="100" y="105" class="eyebrow">CROSS-SESSION MESSAGING</text><text x="100" y="163" class="title">A direct line between agent sessions</text><text x="100" y="198" class="subtitle">XSM connects existing runtimes — no separate messaging server to keep alive.</text><rect x="100" y="226" width="1240" height="3" rx="1.5" fill="url(#accent)"/>
<g filter="url(#shadow)"><rect x="90" y="276" width="390" height="350" rx="22" fill="#FFF"/><rect x="525" y="276" width="390" height="350" rx="22" fill="#FFF"/><rect x="960" y="276" width="390" height="350" rx="22" fill="#FFF"/></g>
<text x="122" y="319" class="eyebrow">01 · SEND</text><text x="122" y="359" class="card-title">An active session</text><text x="122" y="386" class="body">Claude Code or Codex session</text><rect x="122" y="420" width="326" height="82" rx="15" fill="#F5F8FB" stroke="#E6ECF2"/><circle cx="153" cy="461" r="16" fill="#E4F3F0"/><path d="M146 461h14m-5-5 5 5-5 5" stroke="#198C7D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="181" y="455" class="label">xsm send</text><text x="181" y="477" class="small">notice · task · reply</text><text x="122" y="550" class="body">The user decides which sessions</text><text x="122" y="572" class="body">are allowed to communicate.</text>
<text x="557" y="319" class="eyebrow">02 · DELIVER</text><text x="557" y="359" class="card-title">Native runtime path</text><text x="557" y="386" class="body">XSM uses the channel each runtime already has</text><rect x="557" y="420" width="326" height="82" rx="15" fill="#F5F8FB" stroke="#E6ECF2"/><rect x="578" y="441" width="108" height="39" rx="10" fill="#EAF0FF"/><text x="632" y="465" text-anchor="middle" class="label" fill="#4664C7">Claude · inbox</text><rect x="701" y="441" width="160" height="39" rx="10" fill="#E8F5F2"/><text x="781" y="465" text-anchor="middle" class="label" fill="#268678">Codex · queue</text><text x="557" y="550" class="body">No local XSM daemon. Messages use</text><text x="557" y="572" class="body">local, SSH or opt-in P2P paths.</text>
<text x="992" y="319" class="eyebrow">03 · RECEIVE</text><text x="992" y="359" class="card-title">A hook checks the message</text><text x="992" y="386" class="body">Scope and sender are checked before delivery</text><rect x="992" y="420" width="326" height="82" rx="15" fill="#F5F8FB" stroke="#E6ECF2"/><circle cx="1030" cy="461" r="16" fill="#FFF1DF"/><path d="M1030 451l9 4v7c0 6-4 9-9 11-5-2-9-5-9-11v-7l9-4z" stroke="#BD7A22" stroke-width="1.5" stroke-linejoin="round"/><text x="1060" y="455" class="label">Allowed → prompt</text><text x="1060" y="477" class="small">Rejected → held for review</text><text x="992" y="550" class="body">The receiving session stays in control;</text><text x="992" y="572" class="body">rejected messages are not discarded.</text>
<path d="M480 461H514" stroke="#71839A" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M915 461H949" stroke="#71839A" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="100" y="690" class="eyebrow">COMMUNICATION SCOPE</text><text x="100" y="722" class="subtitle">Reach is explicit; broader access always requires a person’s approval.</text>
<rect x="100" y="758" width="250" height="64" rx="16" fill="#FFF" stroke="#E1E8EF"/><circle cx="127" cy="790" r="6" fill="#42A895"/><text x="145" y="786" class="label">Same repository</text><text x="145" y="805" class="small">all subfolders</text>
<rect x="370" y="758" width="250" height="64" rx="16" fill="#FFF" stroke="#E1E8EF"/><circle cx="397" cy="790" r="6" fill="#6382E5"/><text x="415" y="786" class="label">Shared scope</text><text x="415" y="805" class="small">both folders join</text>
<rect x="640" y="758" width="340" height="64" rx="16" fill="#FFF" stroke="#E1E8EF"/><circle cx="667" cy="790" r="6" fill="#D69A40"/><text x="685" y="786" class="label">User-approved reach</text><text x="685" y="805" class="small">one session ↔ another folder</text>
<rect x="1000" y="758" width="340" height="64" rx="16" fill="#FFF" stroke="#E1E8EF"/><circle cx="1027" cy="790" r="6" fill="#8B6BC6"/><text x="1045" y="786" class="label">Worker ↔ parent</text><text x="1045" y="805" class="small">their task link remains open</text>
<text x="100" y="864" class="small">No local XSM daemon · opt-in P2P between machines · runtime-native delivery · scope-checked at both ends</text>
</svg>